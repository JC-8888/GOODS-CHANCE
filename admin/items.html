<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物品管理 — 易搜數碼 Easoug 後台</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/images/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
  <header class="admin-top">
    <div class="inner">
      <span class="brand">♻️ 易搜數碼 後台</span>
      <nav>
        <a href="/admin/items.html" class="active">物品管理</a>
        <a href="/admin/reservations.html">預約管理</a>
        <a href="/admin/reports.html">數據報表</a>
        <button class="logout-link" id="logout">登出</button>
      </nav>
    </div>
  </header>

  <main class="admin-shell">
    <div class="panel">
      <h2>📦 物品管理
        <span class="actions">
          <a class="btn btn-ghost btn-sm" href="/" target="_blank">檢視公眾網站 ↗</a>
          <button class="btn btn-ghost btn-sm" id="btn-bulk">⬆ 批量上架</button>
          <button class="btn btn-ghost btn-sm" id="btn-export">⬇ 匯出 CSV</button>
          <button class="btn btn-primary btn-sm" id="btn-new">＋ 新增物品</button>
        </span>
      </h2>
      <p class="muted" style="margin:-6px 0 10px">
        批量上架：按「⬆ 批量上架」選擇 CSV 檔（可用 Excel 開啟），欄位為
        <code>name, type, price, description, image_url</code>。
        <button type="button" class="linklike" id="btn-template">下載 CSV 範本 ↗</button>
      </p>
      <div class="filters">
        <div class="grow">
          <input type="text" id="search" placeholder="搜尋名稱／描述…">
        </div>
        <span id="chip-row"></span>
      </div>
      <div class="tbl-wrap">
        <table class="tbl" id="items-tbl">
          <thead><tr><th>物品</th><th>類別</th><th>狀態</th><th>更新時間</th><th>操作</th></tr></thead>
          <tbody id="items-body"><tr><td colspan="5">載入中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <input type="file" id="file-input" accept="image/*" hidden>
  <input type="file" id="bulk-file" accept=".csv,text/csv" hidden>

  <script type="module" src="/admin/js/items.js"></script>
</body>
</html>
