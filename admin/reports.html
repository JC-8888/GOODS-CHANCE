<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>數據報表 — 易搜數碼 Easoug 後台</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/images/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
  <header class="admin-top">
    <div class="inner">
      <span class="brand">♻️ 易搜數碼 後台</span>
      <nav>
        <a href="/admin/items.html">物品管理</a>
        <a href="/admin/reservations.html">預約管理</a>
        <a href="/admin/reports.html" class="active">數據報表</a>
        <button class="logout-link" id="logout">登出</button>
      </nav>
    </div>
  </header>

  <main class="admin-shell">
    <div class="panel">
      <h2>📊 營運概覽</h2>
      <div class="stat-grid" id="stat-cards">載入中…</div>
    </div>

    <div class="panel">
      <h2>⬇ 匯出資料</h2>
      <p class="muted" style="margin:-6px 0 12px">CSV 可直接用 Excel 開啟（含中文）；完整備份為 JSON，可用於還原或轉移資料。</p>
      <div class="export-btns">
        <button class="btn btn-ghost" id="exp-items">⬇ 物品清單 CSV</button>
        <button class="btn btn-ghost" id="exp-reservations">⬇ 預約紀錄 CSV</button>
        <button class="btn btn-ghost" id="exp-backup">⬇ 完整備份 JSON</button>
      </div>
    </div>

    <div class="panel">
      <h2>📈 近 6 個月趨勢</h2>
      <div id="chart"></div>
      <div class="legend">
        <span><i style="background:#1e9a6f"></i>物品流通（取走＋售出）</span>
        <span><i style="background:#e8912d"></i>完成取件（預約核銷）</span>
      </div>
    </div>

    <div class="panel">
      <h2>🕒 最近活動</h2>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>時間</th><th>動作</th><th>備註</th></tr></thead>
          <tbody id="act-body"><tr><td colspan="3">載入中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <details>
        <summary style="cursor:pointer;font-weight:700;font-size:16px">⚙️ 店鋪設定（捐款連結、營業資料等）</summary>
        <form id="settings-form" style="margin-top:14px">
          <div class="form-grid">
            <div class="field"><label>店名</label><input type="text" id="s-shop_name" maxlength="60"></div>
            <div class="field"><label>標語</label><input type="text" id="s-tagline" maxlength="60"></div>
            <div class="field"><label>聯絡電話（顯示於網站）</label><input type="text" id="s-contact_phone" maxlength="20"></div>
            <div class="field"><label>地址</label><input type="text" id="s-address" maxlength="200"></div>
            <div class="field"><label>營業時間</label><input type="text" id="s-hours" maxlength="100"></div>
            <div class="field"><label>每月每電話預約上限</label><input type="number" id="s-quota" min="1" max="20" step="1"></div>
            <div class="field full"><label>收款連結（支援頁「立即捐款」前往的網址）</label><input type="url" id="s-payment_url" maxlength="500" placeholder="https://payme.hsbc/… 或 任何收款頁"></div>
            <div class="field"><label>Instagram 連結（顯示於網站）</label><input type="url" id="s-instagram_url" maxlength="500" placeholder="https://www.instagram.com/goodschance/"></div>
            <div class="field"><label>Facebook 連結（顯示於網站）</label><input type="url" id="s-facebook_url" maxlength="500" placeholder="https://www.facebook.com/GoodsChance"></div>
            <div class="field full"><label>店鋪通告（顯示在首頁及預約表單）</label><textarea id="s-notice" rows="2" maxlength="500"></textarea></div>
          </div>
          <button type="submit" class="btn btn-primary">儲存設定</button>
        </form>
      </details>
    </div>
  </main>

  <script type="module" src="/admin/js/reports.js"></script>
</body>
</html>
